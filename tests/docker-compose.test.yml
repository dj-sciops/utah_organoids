version: '3.8'

services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    tmpfs:
      # Use in-memory storage for speed (data not persisted)
      - /var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptest_password"]
      interval: 5s
      timeout: 5s
      retries: 10
